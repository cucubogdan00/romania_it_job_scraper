name: Run Romania IT Job Scraper Daily

on:
  workflow_dispatch: 

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true 

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: |
        docker build -t romania_it_job_scraper .

    - name: Run Scraper Container
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      run: |
        mkdir -p data
        touch data/jobs.db data/scraper.log data/run_stats.json
        
        docker run --rm \
          -e TZ=Europe/Bucharest \
          -e TELEGRAM_TOKEN \
          -e TELEGRAM_CHAT \
          -v $(pwd)/data:/app/data \
          romania_it_job_scraper

    - name: Commit and Push Database Updates
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        git add -f data/jobs.db data/scraper.log data/run_stats.json
        
        if git diff --staged --quiet; then
          echo "No new jobs found. Database and stats are up to date."
        else
          git commit -m "Data: Auto-update jobs database, logs and run statistics [Skip CI]"
          git push origin main
        fi
